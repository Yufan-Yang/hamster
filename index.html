<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- always the beige paper theme, also when the phone is in dark mode -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f0e1">
<title>拾光</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png?v=2">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2">
<style>
  /* 拾光 · pixel style: one pixel font, hard 2px ink borders, flat offset shadows, a small fixed palette */
  @font-face { font-family: "Pixel"; src: url("/static/pixel.woff2") format("woff2"); font-display: swap; }
  :root {
    --bg: #f5f0e1;      /* paper */
    --panel: #fffdf6;
    --ink: #1d1b26;     /* text, borders, shadows */
    --muted: #57536a;
    --faint: #8f8b9c;
    --accent: #ff004d;  /* red: primary actions, brand */
    --yellow: #ffec27;  /* selection, search hits */
    --blue: #1d6fe0;    /* links, tags */
    --green: #00a83e;
    --soft: #e9e2cd;    /* quiet fills */
    --on-accent: #ffffff;
    --overlay: rgba(29, 27, 38, .6);
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  /* no double-tap-to-zoom (it swallows quick taps such as the avatar's triple tap); pinch zoom still works */
  html, button, a, .card { touch-action: manipulation; }
  .avatar { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body, button, input { font-family: "Pixel", "PingFang SC", monospace; font-size: 12px; line-height: 1.75;
                        -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; }
  a { color: inherit; text-decoration: none; }
  button { color: inherit; cursor: pointer; }
  input { color: var(--ink); }
  ::selection { background: var(--yellow); color: #1d1b26; }

  /* shared pixel bits */
  .px { border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: var(--panel); }
  .btn { height: 36px; padding: 0 14px; border: 2px solid var(--ink); background: var(--accent); color: var(--on-accent);
         box-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
  .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
  .btn.plain { background: var(--panel); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { border: 0; background: none; color: var(--blue); padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

  /* top bar: the filters live with it, so both stay visible while browsing a long library */
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 2px solid var(--ink); }
  header { background: var(--bg);
           display: flex; align-items: center; gap: 16px; padding: 10px 24px; padding-top: max(10px, env(safe-area-inset-top)); }
  .logo { display: flex; align-items: center; gap: 10px; flex: none; }
  .logo b { font-size: 24px; line-height: 1; font-weight: normal; color: var(--bg); background: var(--accent);
            border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 4px 8px 6px; letter-spacing: 2px; }
  .logo span { color: var(--muted); }
  .search { flex: 1; max-width: 560px; margin: 0 auto; display: flex; }
  .search input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 2px solid var(--ink); background: var(--panel);
                  outline: none; box-shadow: inset 3px 3px 0 var(--soft); }
  .search input:focus { box-shadow: inset 3px 3px 0 var(--soft), 0 0 0 2px var(--yellow); }
  .right { display: flex; align-items: center; gap: 12px; flex: none; }
  .avatar { width: 36px; height: 36px; border: 2px solid var(--ink); background: var(--panel); color: var(--ink);
            box-shadow: 3px 3px 0 var(--ink); }
  .avatar.on { background: var(--yellow); color: #1d1b26; }
  .avatar:active { transform: translate(3px, 3px); box-shadow: none; }

  /* filter chips */
  .chips { display: flex; gap: 10px; overflow-x: auto; padding: 14px 24px 10px; background: var(--bg); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 30px; padding: 0 10px; border: 2px solid var(--ink); background: var(--panel); white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--bg); }
  .chip.dim:not(.on) { color: var(--faint); border-color: var(--faint); }
  .sort-chip { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  .sort-chip select { height: 26px; max-width: 132px; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 0; }

  main { padding: 0 24px 60px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .scope { color: var(--muted); flex: 1; }

  /* video grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 20px; }
  .card { cursor: pointer; min-width: 0; position: relative; }
  .cover { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--soft);
           border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .card:hover .cover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .card:active .cover { transform: translate(4px, 4px); box-shadow: none; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 36px; color: var(--faint); }
  .badge { position: absolute; right: 0; bottom: 0; background: var(--ink); color: var(--bg); padding: 0 6px;
           font-variant-numeric: tabular-nums; }
  .badge.left { left: 0; right: auto; top: 0; bottom: auto; }
  .badge.bad { background: var(--accent); color: var(--on-accent); }
  .prog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 12px; border: 2px solid #fff; background: rgba(0,0,0,.5); }
  .prog > div { height: 100%; transition: width .6s;
                background: repeating-linear-gradient(90deg, var(--yellow) 0 6px, transparent 6px 8px); }
  .state { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(29,27,38,.6); color: #fff;
           text-align: center; padding: 8px 8px 24px; }
  .info { padding: 10px 0 0; }
  .title { line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
           overflow-wrap: anywhere; }
  .meta { color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
          overflow: hidden; }
  .hit { color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  mark { background: var(--yellow); color: #1d1b26; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; }

  /* batch selection */
  .pick { position: absolute; top: 6px; left: 6px; z-index: 2; width: 24px; height: 24px; border: 2px solid var(--ink);
          background: var(--panel); display: grid; place-items: center; color: var(--ink); }
  .card.picked .pick { background: var(--yellow); }
  .card.picked .cover { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }
  .selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: var(--panel); border-top: 2px solid var(--ink);
            display: flex; align-items: center; gap: 14px; padding: 12px 24px max(12px, env(safe-area-inset-bottom)); }

  /* sheets: add / account / remove */
  .sheet-bg { position: fixed; inset: 0; background: var(--overlay); z-index: 25; display: grid; place-items: center; padding: 16px; }
  .sheet { width: min(520px, 100%); background: var(--panel); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 20px; }
  .sheet h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; font-weight: normal; }
  .sheet input[type=text], .sheet input[type=password] { width: 100%; height: 40px; padding: 0 12px; border: 2px solid var(--ink);
         background: var(--bg); outline: none; margin-bottom: 10px; box-shadow: inset 3px 3px 0 var(--soft); }
  .sheet input:focus { box-shadow: inset 3px 3px 0 var(--soft), 0 0 0 2px var(--yellow); }
  .row { display: flex; gap: 12px; }
  .row .btn { flex: 1; height: 40px; }
  .btn.wide { width: 100%; height: 42px; margin-top: 4px; }
  #more { display: block; margin: 24px auto 0; }
  #more[hidden] { display: none; }
  .drop { border: 2px dashed var(--ink); padding: 20px 12px; text-align: center; color: var(--muted); margin-bottom: 12px; }
  .tips { color: var(--muted); margin-top: 14px; line-height: 2; }
  .tips a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .hint { color: var(--muted); margin: 0 0 12px; }
  .steps { margin: 0 0 12px; padding-left: 20px; }
  .steps li { margin: 0 0 8px; }
  code.copy { font-family: inherit; background: var(--bg); border: 2px solid var(--ink); padding: 0 4px; cursor: pointer;
              overflow-wrap: anywhere; }
  code.copy.block { display: block; margin-top: 6px; padding: 4px 8px; }
  .field { display: block; position: relative; margin-bottom: 10px; }
  .sheet .field input { margin-bottom: 0; }
  .field .note { display: block; color: var(--faint); margin: 2px 2px 0; }
  .field .note:empty { display: none; }
  .field .note.good { color: var(--green); }
  .field .note.bad { color: var(--accent); }
  .field.pw input { padding-right: 60px; }
  .eye { position: absolute; right: 6px; top: 6px; height: 28px; padding: 0 8px; border: 0; background: transparent; color: var(--blue); }
  .form-err { border: 2px solid var(--accent); color: var(--accent); padding: 6px 10px; margin-bottom: 10px; background: var(--bg); }
  .form-err::before { content: "! "; }
  .switch { text-align: center; color: var(--muted); margin-top: 14px; }
  .switch a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .check { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 2px solid var(--ink); background: var(--bg);
           padding: 10px 12px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .check span { flex-basis: 100%; color: var(--accent); padding-left: 26px; }
  .devs { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding: 0 4px 4px 0; }
  .dev { display: flex; align-items: center; gap: 10px; border: 2px solid var(--ink); background: var(--bg); padding: 8px 10px; }
  .dev-main { flex: 1; min-width: 0; cursor: pointer; }
  .dev .sub, .devs > .sub { color: var(--muted); overflow-wrap: anywhere; }
  .dev .cur { color: #1d1b26; background: var(--yellow); padding: 0 4px; margin-left: 4px; }
  .dev .btn { flex: none; height: 30px; }

  #dropAll { position: fixed; inset: 12px; z-index: 30; background: rgba(255,236,39,.18); border: 4px dashed var(--ink);
             display: grid; place-items: center; font-size: 24px; color: var(--ink); pointer-events: none; }
  #dropAll:not([hidden]) { animation: fadeIn .15s steps(3); }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--accent); padding: 8px 16px; z-index: 40; max-width: calc(100% - 32px); }

  /* watch page */
  #watch { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; }
  .wbar { position: sticky; top: 0; background: var(--bg); border-bottom: 2px solid var(--ink); display: flex; align-items: center;
          gap: 12px; padding: 10px 24px; padding-top: max(10px, env(safe-area-inset-top)); z-index: 2; }
  .wbar button { border: 2px solid var(--ink); background: var(--panel); box-shadow: 3px 3px 0 var(--ink); height: 36px; padding: 0 12px; }
  .wbar button:active { transform: translate(3px, 3px); box-shadow: none; }
  .wbar b { font-weight: normal; color: var(--accent); font-size: 24px; line-height: 1; letter-spacing: 2px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }
  .stage { position: relative; background: #000; aspect-ratio: 16 / 9; display: grid; place-items: center;
           border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  /* the frame stays 16:9 (and fits the window); portrait videos are letterboxed inside it instead of making it
     taller than the screen */
  .stage { max-height: calc(100vh - 120px); max-height: calc(100dvh - 120px); }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .stage .msg { color: #eee; text-align: center; padding: 20px; }
  .stage.audio img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .stage.audio .note-big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; color: #555; }
  .stage.audio audio { position: absolute; left: 12px; bottom: 12px; width: calc(100% - 24px); height: 54px; z-index: 1; display: block; }
  .castOverlay { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 4; color: #fff;
                 background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.45); border-radius: 4px;
                 padding: 8px 12px; text-shadow: 0 1px 2px #000; }
  .castOverlay[hidden] { display: none; }
  .castNotice { background: var(--yellow); color: var(--ink); padding: 8px 12px; font-size: 13px; }
  .castNotice[hidden] { display: none; }
  .castNotice button { margin-left: 8px; text-decoration: underline; background: transparent; border: 0; color: inherit; }
  .castHead { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .castHead span { color: rgba(255,255,255,.82); font-variant-numeric: tabular-nums; }
  .castOverlay input[type=range] { accent-color: var(--yellow); }
  .castActions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .castActions button { border: 1px solid rgba(255,255,255,.7); background: rgba(0,0,0,.4); color: #fff; padding: 3px 9px; }
  .castVolume { font-size: 13px; margin: 2px 0 4px; }
  .castVolume input { width: min(180px, 42vw); }
  .warn { margin-top: 14px; border: 2px solid var(--ink); background: var(--yellow); color: #1d1b26; padding: 6px 10px; }
  .wtitle { font-size: 24px; line-height: 1.4; margin: 20px 0 8px; overflow-wrap: anywhere; font-weight: normal; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .tags span { color: var(--blue); cursor: pointer; border: 2px solid var(--blue); padding: 0 6px; }
  .tags span:hover { background: var(--blue); color: var(--bg); }
  .wmeta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .wmeta a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .parts { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
  .parts button { border: 2px solid var(--ink); background: var(--panel); padding: 2px 10px; }
  .parts button.on { background: var(--ink); color: var(--bg); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .actions button { height: 32px; padding: 0 12px; border: 2px solid var(--ink); background: var(--panel); box-shadow: 3px 3px 0 var(--ink); }
  .actions button:active { transform: translate(3px, 3px); box-shadow: none; }
  .desc { border: 2px solid var(--ink); background: var(--panel); box-shadow: 4px 4px 0 var(--ink); padding: 12px 14px; margin-top: 20px; cursor: pointer; }
  .desc .sum { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { cursor: default; }
  .desc.open .sum { display: block; }
  .desc .more { display: none; }
  .desc.open .more { display: block; }
  .desc.open .expand { display: none; }
  .desc .toggle { color: var(--blue); margin-top: 4px; cursor: pointer; }
  .desc ul { margin: 10px 0 0; padding-left: 0; list-style: none; }
  .desc li { margin: 4px 0; padding-left: 16px; position: relative; }
  .desc li.jump { cursor: pointer; }
  .desc li.jump:hover { background: var(--bg); }
  .desc li .at { font-weight: normal; background: var(--ink); color: var(--bg); padding: 0 4px; font-variant-numeric: tabular-nums; }
  .desc li::before { content: "■"; position: absolute; left: 0; color: var(--accent); }
  .card.is-hidden .cover { opacity: .45; }
  .badge.hid { background: var(--muted); color: var(--bg); }
  .pv { color: var(--muted); }
  .pv.on { background: var(--yellow); color: #1d1b26; padding: 0 4px; }
  .psec { border-bottom: 2px solid var(--ink); margin: 0 0 8px; padding-bottom: 2px; }
  .ptags { display: flex; flex-wrap: wrap; gap: 8px; }
  .ptag { border: 2px solid var(--ink); background: var(--bg); padding: 0 0 0 6px; display: inline-flex; align-items: center; gap: 4px; }
  .ptag button { border: 0; border-left: 2px solid var(--ink); background: var(--panel); height: 100%; padding: 0 6px; }
  .sub { color: var(--muted); }
  /* 追更: followed uploaders */
  .subs { display: flex; flex-direction: column; gap: 14px; max-width: 900px; }
  .subadd { display: flex; gap: 10px; }
  .subadd input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 2px solid var(--ink); background: var(--panel);
                  outline: none; box-shadow: inset 3px 3px 0 var(--soft); }
  .subadd input:focus { box-shadow: inset 3px 3px 0 var(--soft), 0 0 0 2px var(--yellow); }
  .subrow { display: flex; gap: 14px; align-items: flex-start; }
  .subrow .face { flex: none; width: 56px; height: 56px; border: 2px solid var(--ink); background: var(--soft); overflow: hidden;
                  display: grid; place-items: center; font-size: 24px; color: var(--faint); }
  .subrow .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .subrow .body { flex: 1; min-width: 0; }
  .subrow .name { font-size: 24px; line-height: 1.3; overflow-wrap: anywhere; cursor: pointer; }
  .subrow .plat { font-size: 12px; border: 2px solid var(--ink); padding: 0 4px; margin-left: 8px; vertical-align: middle; }
  .subrow .plat.bilibili { background: #fb7299; color: #fff; border-color: var(--ink); }
  .subrow .plat.youtube { background: var(--accent); color: #fff; }
  .subrow .plat.pornhub { background: #000; color: #ff9000; }
  .subrow .acts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; }
  .subrow .flt { color: var(--ink); }
  .subrow .flt b { font-weight: normal; background: var(--yellow); color: #1d1b26; padding: 0 4px; }
  /* 追更 filter editor: conditions, and groups of them, joined by 全部 (and) / 任一 (or) */
  .fed { border-top: 2px dashed var(--ink); margin-top: 8px; padding-top: 6px; }
  .fgrp.nest { border: 2px solid var(--ink); background: var(--soft); padding: 4px 8px; margin: 6px 0; }
  .frow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 6px 0; }
  .frow select, .frow input { font: inherit; height: 32px; border: 2px solid var(--ink); border-radius: 0; background: var(--panel);
                              color: var(--ink); padding: 0 6px; }
  .frow input { flex: 1; min-width: 110px; }
  .frow .x { width: 32px; height: 32px; border: 2px solid var(--ink); background: var(--panel); color: var(--accent); padding: 0; }
  .frow .andor { color: var(--muted); }
  .fed .btn { height: 32px; }
  .err { white-space: pre-line; color: var(--accent); margin-top: 12px; overflow-wrap: anywhere; }
  /* 随记: everyday notes */
  .notes { max-width: 720px; }
  .compose { padding: 12px; margin-bottom: 24px; }
  .compose textarea, .note textarea { display: block; width: 100%; min-height: 84px; resize: vertical; border: 2px solid var(--ink);
         background: var(--bg); color: var(--ink); padding: 8px 10px; outline: none; box-shadow: inset 3px 3px 0 var(--soft);
         font: inherit; }
  .compose textarea:focus, .note textarea:focus { box-shadow: inset 3px 3px 0 var(--soft), 0 0 0 2px var(--yellow); }
  .crow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .crow .grow { flex: 1; color: var(--muted); min-width: 0; }
  .crow .btn { height: 34px; padding: 0 10px; }
  .btn.rec { background: var(--accent); color: var(--on-accent); animation: blink 1s steps(2) infinite; }
  .att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .att:empty { display: none; }
  .att .it { position: relative; width: 72px; height: 72px; border: 2px solid var(--ink); background: var(--soft); display: grid;
             place-items: center; color: var(--muted); overflow: hidden; text-align: center; font-size: 12px; line-height: 1.3; }
  .att .it img, .att .it video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att .it button { position: absolute; top: 0; right: 0; width: 22px; height: 22px; border: 0; border-left: 2px solid var(--ink);
                    border-bottom: 2px solid var(--ink); background: var(--panel); padding: 0; line-height: 1; }
  .nday { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
  .nday b { font-weight: normal; background: var(--ink); color: var(--bg); padding: 0 8px; }
  .nday::after { content: ""; flex: 1; border-top: 2px dashed var(--faint); }
  .note { padding: 10px 14px 8px; margin-bottom: 14px; }
  .note .ntime { color: var(--muted); display: flex; gap: 12px; }
  .note .ntime span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note .ntext { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0; }
  .note .ntext a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .nimgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 420px; margin: 8px 0; }
  .nimgs.one { grid-template-columns: 1fr; max-width: 360px; }
  .nimgs .ph { position: relative; aspect-ratio: 1; border: 2px solid var(--ink); background: var(--soft); overflow: hidden; cursor: zoom-in; }
  .nimgs.one .ph { aspect-ratio: auto; }
  .nimgs img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* photo viewer: pinch / wheel / double-tap to zoom, drag to pan, swipe for the next photo, swipe down to close */

  /* reader: one page at a time (columns, swiped / tapped) or scrolling; its own paper colour and fonts */
  #reader { --rd-bg: #f5f0e1; --rd-ink: #1d1b26; --rd-muted: #8f8b9c; --rd-mx: 22px;
            --rd-font: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", serif;
            --rd-size: 19px; --rd-lh: 1.8; position: fixed; inset: 0; z-index: 16; background: var(--rd-bg); color: var(--rd-ink);
            overflow: hidden; -webkit-user-select: text; user-select: text; }
  #reader.night { --rd-bg: #1d1b26; --rd-ink: #cfc8b4; --rd-muted: #6f6b7c; }
  #reader.f-sans { --rd-font: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
  #reader.f-pixel { --rd-font: "Pixel", "PingFang SC", monospace; }
  #reader:not([hidden]) { animation: slideIn .26s steps(6); }
  #reader.closing { animation: slideOut .17s steps(4) forwards; }
  /* text no wider than ~38 Chinese characters a line on big screens (the side margins grow instead) */
  #reader { --rd-side: max(var(--rd-mx), calc((100vw - 780px) / 2)); }
  .rd-view { position: absolute; inset: 0; padding: calc(env(safe-area-inset-top) + 34px) var(--rd-side) calc(env(safe-area-inset-bottom) + 30px); }
  .rd-page { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
  #reader.scroll .rd-page { overflow-y: auto; touch-action: pan-y pinch-zoom; overscroll-behavior: contain; }
  .rd-flow { height: 100%; column-fill: auto; font-family: var(--rd-font); font-size: var(--rd-size); line-height: var(--rd-lh);
             text-align: justify; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-wrap: break-word;
             will-change: transform; color: var(--rd-ink); }

  .rd-flow.anim { transition: transform .16s steps(4); }
  /* books in Latin script: a Latin face first, so quotes and apostrophes aren't full-width CJK ones */

  #reader.f-sans .rd-flow:not(:lang(zh)) { font-family: -apple-system, "Helvetica Neue", "Noto Sans", Arial, sans-serif; }
  #reader.f-pixel .rd-flow:not(:lang(zh)) { font-family: var(--rd-font); }
  .rd-flow p { margin: 0 0 .5em; text-indent: 2em; }
  .rd-flow:not(:lang(zh)) p { text-indent: 0; margin-bottom: .8em; }
  .rd-flow h1, .rd-flow h2, .rd-flow h3, .rd-flow h4, .rd-flow h5, .rd-flow h6 { text-align: center; text-indent: 0; line-height: 1.4;
             margin: .4em 0 1em; font-weight: bold; break-after: avoid; }
  .rd-flow h1 { font-size: 1.45em; } .rd-flow h2 { font-size: 1.3em; } .rd-flow h3 { font-size: 1.15em; } .rd-flow h4 { font-size: 1.05em; }
  .rd-flow img { display: block; max-width: 100%; max-height: var(--rd-imgh, 80vh); height: auto; margin: .4em auto; object-fit: contain;
                 break-inside: avoid; }
  .rd-flow p:has(> img) { text-indent: 0; }
  .rd-flow sup img, .rd-flow a img { display: inline; height: 1em; width: auto; margin: 0; vertical-align: super; }
  .rd-flow .c { text-align: center; text-indent: 0; } .rd-flow .r { text-align: right; text-indent: 0; }

  .rd-flow a[href], .rd-flow a[data-go] { color: var(--blue); }

  .rd-flow td, .rd-flow th { border: 1px solid var(--rd-muted); padding: 2px 6px; }
  .rd-flow pre { white-space: pre-wrap; font-size: .85em; }
  .rd-flow hr { border: 0; border-top: 1px solid var(--rd-muted); margin: 1em 20%; }

  .rd-row { display: flex; align-items: center; gap: 8px; }

  .rd-shade { position: absolute; inset: 0; z-index: 4; background: rgba(29,27,38,.35); }

<script>
const $ = s => document.querySelector(s);
// The privacy unlock lives only in this page's memory: a reload, or leaving the page in the

let privacyToken = null, privacyTimer = null, hiddenSince = 0;
const _fetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (privacyToken) opts = {...opts, headers: {...(opts.headers || {}), "X-Privacy-Token": privacyToken}};
  return _fetch(url, opts);
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FOLDERS = {"Music Videos": "音乐MV", "Tutorials": "教程", "Talks": "演讲", "News": "新闻", "Gaming": "游戏",
                 "Sports": "体育", "Documentaries": "纪录片", "Vlogs": "Vlog", "Comedy": "搞笑", "Clips": "片段", "Other": "其他"};
const LIBS = {"Movies": "电影", "TV": "剧集", "Music": "音乐", "Downloads": "文件"};
const STAGES = {"starting": "准备中", "downloading video": "下载中", "downloading torrent": "下载种子", "downloading file": "下载中",
                "looking for the video on the page": "在页面上找视频",
                "merging video and audio": "合并音视频", "fixing up the file": "整理文件", "inspecting": "检查文件", "making it Plex-friendly": "转换格式",
                "classifying": "AI 分类", "transcribing speech": "语音转文字", "summarizing": "AI 总结", "filing into library": "归档"};
const ACTIVE = ["queued", "downloading", "processing"];

let state = {jobs: [], user: null, admin: false}, query = "", chip = "all", watching = null, deviceFilter = null, castTimer = null, casting = null, castVolumeTimer = null;
let castQueue = Promise.resolve();
let selecting = false, selected = new Set(), shown = [], cardHtml = [], lastBody = "";
let videoSort = lsGet("videoSort", "added");

// Close a sheet / the watch page with a short exit animation instead of vanishing
function hide(el, after) {
  if (!el || el.hidden || el.classList.contains("closing")) return;
  el.classList.add("closing");
  setTimeout(() => { el.hidden = true; el.classList.remove("closing"); after && after(); }, 170);
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3000); }
// Escape, then highlight the search term
function hl(s, marks) {
  const e = esc(s);
  const terms = (marks && marks.length ? marks : query ? [query] : []).filter(Boolean);
  if (!terms.length) return e;
  const re = terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length).join("|");
  return e.replace(new RegExp(re, "gi"), m => `<mark>${m}</mark>`);
}
function dur(sec) {
  if (!sec) return "";
  sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function ago(t) {
  const d = Date.now() / 1000 - t;
  if (d < 60) return "刚刚"; if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前"; if (d < 86400 * 30) return Math.floor(d / 86400) + " 天前";
  return new Date(t * 1000).toLocaleDateString("zh-CN");
}
function category(j) {
  const a = j.analysis || {};
  if (j.status !== "done") return null;
  return a.library === "Videos" ? (a.folder || "Other") : (a.library || "Other");
}
function catName(c) { return FOLDERS[c] || LIBS[c] || c; }
function titleOf(j) { return (j.analysis || {}).title || j.title || (j.url.startsWith("torrent-file:") ? "种子文件" : j.url); }
function subOf(j) {
  const m = /^sub:(\d+)$/.exec(j.source || "");
  return m ? (state.subs || []).find(s => s.id === +m[1]) : null;
}
function phone(j) {
  const d = j.device || ((j.source || "").startsWith("shortcut:") ? j.source.slice(9) : null);
  return d ? d.replace(/^📱\s*/, "") : null;
}

/* ---------- grid ---------- */
function renderChips() {
  // categories: counted over the whole library on the Pi (the list only holds a page of the newest)
  const counts = {...(state.cats || {})};
  if (!state.cats) state.jobs.forEach(j => { const c = category(j); if (c) counts[c] = (counts[c] || 0) + 1; });
  const active = state.jobs.filter(j => ACTIVE.includes(j.status)).length;
  const failed = state.jobs.filter(j => j.status === "failed").length;
  const list = [["all", "全部"], ["notes", `随记${state.notes ? " " + state.notes : ""}`], ["books", `书架${state.books ? " " + state.books : ""}`]];
  if (deviceFilter) list.push(["device", `设备：${deviceFilter} ✕`]);
  list.push(["subs", `追更${(state.subs || []).length ? " " + state.subs.length : ""}`]);
  const sf = chip.startsWith("sub:") && (state.subs || []).find(s => "sub:" + s.id === chip);
  if (sf) list.push([chip, `UP：${sf.name} ✕`]);
  if (active) list.push(["active", `下载中 ${active}`]);
  // every category is always listed; ones with content first
  const all = [...Object.keys(FOLDERS), ...Object.keys(LIBS)];
  all.sort((a, b) => (counts[b] || 0) - (counts[a] || 0)).forEach(c => list.push([c, catName(c)]));
  if (failed) list.push(["failed", `失败 ${failed}`]);
  if (!list.some(([k]) => k === chip)) chip = "all";
  const sort = !["notes", "books", "subs"].includes(chip) ? `<label class="chip sort-chip">排序
    <select onchange="setVideoSort(this.value)">${[["published", "网页创建时间"], ["added", "添加时间"], ["title", "标题"], ["author", "作者"]]
      .map(([k, n]) => `<option value="${k}"${k === videoSort ? " selected" : ""}>${n}</option>`).join("")}</select></label>` : "";
  const chipsHtml = list.map(([k, n]) => `<button class="chip${k === chip ? " on" : ""}${counts[k] === undefined && (FOLDERS[k] || LIBS[k]) ? " dim" : ""}" onclick="setChip('${esc(k)}')">${esc(n)}</button>`).join("") + sort;
  if ($("#chips").innerHTML !== chipsHtml) $("#chips").innerHTML = chipsHtml;
}
function setChip(k) {
  if (k === "device" && chip === "device") { deviceFilter = null; k = "all"; }  // click the device chip again to clear it

async function refresh() {
  try {
    const params = new URLSearchParams();
    if (query && chip !== "books") params.set("q", query);  // on 书架 the search is in the books (loadBooks)
    if (chip.startsWith("sub:")) params.set("sub", chip.slice(4));
    if (FOLDERS[chip] || LIBS[chip]) params.set("cat", chip);  // the whole category, not a page of the newest
    if (videoSort !== "added") params.set("sort", videoSort);
    if (query && smartSearch && !exactSearch) params.set("nl", "1");
    if (pageLimit > 100) params.set("limit", pageLimit);
    if (chip === "notes") loadNotes();
    if (chip === "books") loadBooks();
    const body = await (await fetch("/api/jobs" + (params.size ? "?" + params : ""))).text();
    if (body !== lastBody) {  // nothing changed: leave the page alone
      lastBody = body;
      state = JSON.parse(body);
      render();
      // From outside the home network everything needs an account: go straight to the login form
      if (state.login_required && $("#accountSheet").hidden) openAccount();

  } catch (e) {
    // no Pi: if this device has books cached, the shelf still works
    if (!state.jobs.length && chip !== "books" && !wentOffline) {

      await refreshCacheIndex();
      if (cacheIndex.size) { setChip("books"); toast("连不上 Pi：显示这台设备上缓存的书"); schedule(); return; }
    }

    lb.x = lb.y = 0; applyViewer(true);

// Photos are made smaller before upload (and HEIC becomes JPEG); videos and audio go up as they are
async function shrink(file) {
  // JPEGs up to 10 MB go as they are: re-encoding would drop their EXIF (where the photo was taken)
  if (/gif/.test(file.type) || (file.size < 3e6 && /png|webp/.test(file.type)) || (file.size < 10e6 && /jpeg/.test(file.type))) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
    return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type: "image/jpeg"}) : file;
  } catch (e) { return file; }
}

let recorder = null, recStart = 0, recTimer = null;
async function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    toast("这个地址不是 https，浏览器不让网页录音；可以选一个录好的音频，或者用键盘上的语音输入");
    pickNoteFiles("audio/*"); return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch (e) { toast("没有麦克风权限"); return; }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  const chunks = [];
  recorder = new MediaRecorder(stream, type ? {mimeType: type} : {});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(recTimer);
    const secs = (Date.now() - recStart) / 1000, mime = recorder.mimeType || type || "audio/webm";
    recorder = null; $("#recBtn").classList.remove("rec"); $("#recBtn").textContent = "语音";
    const blob = new Blob(chunks, {type: mime.split(";")[0]});
    const file = new File([blob], `语音.${/mp4/.test(mime) ? "m4a" : "webm"}`, {type: blob.type});
    noteFiles.push({file, kind: "audio", url: URL.createObjectURL(file), secs}); renderAtt();
  };
  recorder.start(); recStart = Date.now();
  $("#recBtn").classList.add("rec");
  const tick = () => $("#recBtn").textContent = "■ 停止 " + dur(Math.max(1, (Date.now() - recStart) / 1000));
  tick(); recTimer = setInterval(tick, 500);
}

// the summary's key points, each with the moment it's talked about: click to jump there
async function loadPointTimes(id) {
  let r;
  try { r = await (await fetch(`/api/points/${id}`)).json(); } catch (e) { return; }
  if (!watching || watching.id !== id) return;
  const ch = (r.chapters || {})[String(watching.part)] || [];

  const len = (((state.jobs.find(j => j.id === id) || {}).media || [])[watching.part] || {}).duration
    || (heat ? heat.step * heat.values.length : 0);
  const peaks = heat ? heatPeaks(heat) : [];
  const ul = $("#points"), lis = ul ? [...ul.children] : [];
  // key points said in this part go under the chapter they fall in: one list, not two (the rest stay in the summary)
  const under = ch.map(() => []), moved = new Set();
  lis.forEach((li, i) => {
    const at = (r.times || [])[i];
    if (!ch.length || !at || at.part !== watching.part) return;
    const k = Math.max(0, ch.findLastIndex(c => c.t <= at.t + 1));
    under[k].push(`<button class="pt" onclick="seekTo(${id}, ${watching.part}, ${at.t})">${li.innerHTML}</button>`);
    moved.add(i);

  const sec = (title, list, subs) => list.length ? `<div class="psec">${title}</div>${list.map((c, k) =>
    `<button onclick="seekTo(${id}, ${watching.part}, ${c.t})"><b class="at">${dur(c.t) || "0:00"}</b>${esc(c.title)}</button>`
    + (subs ? subs[k].join("") : "")).join("")}` : "";
  if ((ch.length || mk.length || peaks.length) && $("#chapters"))
    $("#chapters").innerHTML = (heat && len ? heatStrip(id, heat, mk, len) : "")
      + `<div class="hits">${sec("网站标记", mk)}${sec("看的人最多", peaks)}${sec(moved.size ? "章节和要点" : "章节", ch, under)}</div>`;
  if (!ul) return;
  lis.forEach((li, i) => moved.has(i) && li.remove());
  if (!ul.children.length) ul.remove();
  const multi = ((state.jobs.find(j => j.id === id) || {}).media || []).length > 1;
  lis.forEach((li, i) => {

    li.insertAdjacentHTML("afterbegin", `<b class="at">${multi ? `P${at.part + 1} ` : ""}${dur(at.t) || "0:00"}</b> `);

// the site's watch counts as a strip of bars under the player, its marks as ticks on it; click to go there
function heatStrip(id, heat, marks, len) {
  const bars = heat.values.map(v => `<i style="height:${Math.max(4, v)}%"></i>`).join("");
  const ticks = marks.map(m => `<b class="mk" style="left:${Math.min(100, m.t / len * 100).toFixed(2)}%" title="${esc(m.title)} ${dur(m.t)}"><span>${esc(m.title)}</span></b>`).join("");
  return `<div class="heat" onclick="const r = this.getBoundingClientRect(); seekTo(${id}, watching.part, Math.max(0, (event.clientX - r.left) / r.width * ${len}))"
    title="网站上每一段被看的多少，点一下跳过去">${bars}${ticks}</div>`;
}
// the three most watched moments (peaks at least a minute apart)
function heatPeaks(heat) {
  const v = heat.values, gap = Math.max(1, Math.round(60 / heat.step)), out = [];
  const order = v.map((x, i) => i).filter(i => i > 0).sort((a, b) => v[b] - v[a]);  // the first bar is everyone starting
  for (const i of order) {
    if (out.length >= 3 || v[i] < 20) break;
    if (out.every(j => Math.abs(j - i) >= gap)) out.push(i);
  }
  return out.sort((a, b) => a - b).map(i => ({t: i * heat.step, title: `热度 ${v[i]}`}));
}

  if (!hits.length || !query) return "";
  const multi = (j.media || []).length > 1, timed = hits.filter(h => h.t != null).length;
  return `<div class="hits"><div class="psec">「${esc(query)}」出现在 ${hits.length}${hits.length >= 30 ? "+" : ""} 处${timed ? "，点一下跳到那里" : ""}</div>
    ${hits.map(h => h.t == null ? `<div class="hitrow">${hitLabel(h)}：${hl(h.text)}</div>`
      : `<button onclick="seekTo(${j.id}, ${h.part}, ${h.t})">${hitLabel(h, multi)}：${hl(h.text)}</button>`).join("")}</div>`;
}
function seekTo(id, part, t) {
  const v = $("#watchBody video, #watchBody audio");
  if (!v || !watching || watching.id !== id || watching.part !== part) { openWatch(id, part, t); return; }
  if (casting) { castSeek(casting.device, t); return; }
  v.currentTime = t; v.play().catch(() => {});
  $("#watch").scrollTo({top: 0, behavior: "smooth"});
}

/* ---------- player ----------
   Only one media element ever exists; re-rendering or closing stops it first, so two sounds can't play at once. */
function stopMedia() {
  saveWatch();
  document.querySelectorAll("#watchBody video, #watchBody audio").forEach(el => { el.pause(); el.removeAttribute("src"); el.load(); });
}
function setupMediaSession(j) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: titleOf(j), artist: (j.analysis || {}).creator || "拾光",
    artwork: j.thumb ? [{src: `/thumb/${j.id}`, sizes: "640x360", type: "image/jpeg"}] : []});
}
const SUB_NAMES = {"zh": "中文", "en": "English", "en-orig": "English（自动）", "ja": "日本語", "ko": "한국어", "yue": "粤语"};
function videoTag(j, m, t = 0) {
  // Subtitles, including bilingual tracks, are available but off until selected.
  const bi = m.bilingual ? `<track kind="subtitles" src="${m.bilingual}" label="双语" srclang="zh">` : "";
  const tracks = bi + m.subs.map((label, k) =>
    `<track kind="subtitles" src="${m.subsrc[k]}" label="${esc(SUB_NAMES[label] || label)}" srclang="${esc(label.split("-")[0])}">`).join("");
  return `<video ${casting ? 'preload="none"' : 'controls autoplay preload="metadata"'} playsinline x-webkit-airplay="allow" ${j.thumb ? `poster="/thumb/${j.id}"` : ""} src="${m.src}${t ? "#t=" + t.toFixed(1) : ""}">${tracks}</video>`;
}
function airplayAvailable() {
  const p = window.HTMLMediaElement && HTMLMediaElement.prototype;
  return !!(p && typeof p.webkitShowPlaybackTargetPicker === "function");
}
function showAirPlay() {
  const el = $("#watchBody video, #watchBody audio");
  if (!el || !airplayAvailable()) return toast("请用 Safari 播放后，从播放器里选择 AirPlay");
  try { el.webkitShowPlaybackTargetPicker(); } catch (e) { toast("没有找到可用的 AirPlay 设备"); }
}
/* 分享: one link per person; the first browser that opens it keeps it, forwarded on it doesn't open */

  const rows = (r.shares || []).map(s => `<div style="margin-top:10px">

      <span class="meta">${s.claimed ? `已被 ${esc(s.label || "一台设备")} 领取 · 看了 ${s.opens} 次${s.seen ? " · 最近 " + esc(ago(s.seen)) : ""}` : `还没人打开 · ${esc(ago(s.created))}建的`}</span>
      ${s.claimed ? `<button class="link" onclick="shareAction(${id},'${s.code}','reset')">解绑</button>` : ""}

// Serialize transport commands: a slow start must finish before a chapter seek or the next video.
function castRequest(session, path, body) {
  const run = castQueue.catch(() => {}).then(async () => {
    if (casting !== session) return null;
    const response = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const r = await response.json();
    if (!response.ok || r.error) throw new Error(r.error || "电视连接失败");
    return r;
  });
  castQueue = run.catch(() => {});
  return run;
}
function castError(session, error) {
  if (casting !== session) return;
  session.error = error.message || "电视连接失败";
  renderCastNotice();
  toast(session.error + "；手机仍保持暂停");
}
function renderCastNotice() {
  const c = casting;
  const label = c ? `${c.error ? '投屏连接异常' : c.pending ? '正在连接电视' : c.state === 'PAUSED_PLAYBACK' ? '投屏已暂停' : c.state === 'STOPPED' || c.state === 'NO_MEDIA_PRESENT' ? '投屏已停止' : '投屏中'} · ${c.name || '电视'}` : "";
  for (const selector of ["#castNotice", "#watchCastNotice"]) {
    const el = $(selector); if (!el) continue;
    el.hidden = !c;
    el.innerHTML = c ? `${esc(label)} · 下个视频继续投到此设备
      <button onclick="openJob(casting.id)">投屏控制</button>
      ${c.error ? '<button onclick="startCast(casting.id,casting.part,casting.device,casting.position)">重试连接</button>' : ''}
      <button onclick="castControl(casting.device,'stop')">停止投屏</button>` : "";
  }
  const labelEl = $("#castTime");
  if (labelEl && c) labelEl.textContent = c.error ? c.error : `${label} · ${dur(c.position || 0) || '0:00'} / ${dur(c.duration || 0) || '0:00'}`;
}
function saveCastWatch(c) {
  if (!c.ready || !c.duration || c.position < 5) return;
  const secs = Math.floor(c.secs || 0); c.secs = (c.secs || 0) - secs;
  fetch(`/api/watch/${c.id}`, {method: "POST", headers: {"Content-Type": "application/json"}, keepalive: true,
    body: JSON.stringify({part: c.part, pos: c.position, dur: c.duration, ended: false, secs})}).catch(() => {});
  const j = state.jobs.find(x => x.id === c.id);
  if (j) j.watch = {part: c.part, pos: c.position, dur: c.duration, at: Date.now() / 1000,
    done: !!(j.watch && j.watch.done) || c.position > c.duration - 30};
  c.savedAt = Date.now();
}
async function startCast(id, part, device, position = null) {
  const el = $("#watchBody video, #watchBody audio");
  const old = casting;
  if (position === null) position = old && old.id === id && old.part === part ? old.position : el && isFinite(el.currentTime) ? el.currentTime : 0;
  saveWatch();
  const c = casting = {id, part, device, name: old && old.device === device ? old.name : '电视', position, pending: true, revision: 0};
  clearTimeout(castVolumeTimer);
  if (el) { el.pause(); el.autoplay = false; el.controls = false; }
  showCastControls(device, c.name);
  renderCastNotice();
  clearInterval(castTimer);
  castTimer = setInterval(() => { if (casting) castStatus(casting.device); }, 2000);
  try {
    const r = await castRequest(c, "/api/cast/start", {id, part, device, position});
    if (casting !== c || !r) return;
    c.name = r.name; c.pending = false; c.ready = true; c.state = 'PLAYING';
    renderCastNotice();
    toast(`投屏中 · ${r.name}，切换视频将继续投到电视`);
    castStatus(device);
  } catch (e) { c.pending = false; castError(c, e); }
}
function showCastControls(device, name) {
  const box = $("#castBox"), overlay = $("#castOverlay"); if (!overlay) return;
  if (box) box.innerHTML = "";
  overlay.innerHTML = `<div class="castHead"><b>电视遥控</b> <span id="castTime">投屏中 · ${esc(name)}</span></div>
    <input id="castSeek" type="range" min="0" max="1" value="0" step="1" style="width:100%;margin:10px 0" oninput="castSeekPreview(this.value)" onchange="castSeek(${esc(JSON.stringify(device))},this.value)">
    <div class="castVolume" id="castVolume"></div>
    <div class="castActions"><button onclick="castControl(${esc(JSON.stringify(device))},'play')">播放</button>
    <button onclick="castControl(${esc(JSON.stringify(device))},'pause')">暂停</button>
    <button onclick="castControl(${esc(JSON.stringify(device))},'stop')">停止投屏</button></div>`;
  overlay.hidden = false;
  renderCastNotice();
}
async function castStatus(device) {
  const c = casting;
  if (!c || c.device !== device || c.pending || !c.ready || c.polling) return;
  c.polling = true;
  const revision = c.revision;
  try {
    const r = await (await fetch(`/api/cast/status?device=${encodeURIComponent(device)}`)).json();
    if (casting !== c || revision !== c.revision) return;
    if (r.error) throw new Error(r.error);
    c.error = null;
    const seek = $("#castSeek");
    if (c.seeking && (Math.abs((r.position || 0) - c.seekTarget) <= 3 || Date.now() > c.seekDeadline)) c.seeking = false;
    if (seek && r.duration) {
      seek.max = r.duration;
      seek.value = Math.min(c.seeking ? c.seekTarget : r.position || 0, r.duration);
    }
    const delta = (r.position || 0) - c.position;
    if (!c.seeking && c.state === 'PLAYING' && r.state === 'PLAYING' && delta > 0 && delta < 5) c.secs = (c.secs || 0) + delta;
    if (!c.seeking) c.position = r.position || 0;
    c.duration = r.duration || 0; c.state = r.state;
    renderCastNotice();
    if (!c.savedAt || Date.now() - c.savedAt > 10000) saveCastWatch(c);
    const volume = $("#castVolume");
    if (volume && r.volume !== null && r.volume !== undefined && !(casting && casting.adjustingVolume))
      volume.innerHTML = `音量 <input id="castVolumeRange" type="range" min="0" max="100" value="${r.volume}" style="vertical-align:middle" oninput="castVolume(${esc(JSON.stringify(device))},this.value)"> <span id="castVolumeValue">${r.volume}%</span>`;
  } catch (e) {
    if (casting === c && revision === c.revision) { c.error = e.message || "无法读取电视状态"; renderCastNotice(); }
  } finally { c.polling = false; }
}
function castSeekPreview(position) {
  const label = $("#castTime"); if (!label) return;
  const old = label.textContent.split(" · ")[0]; label.textContent = `${old} · ${dur(+position)} / ${dur(+$("#castSeek").max || 0)}`;
}
async function castSeek(device, position) {
  const c = casting; if (!c || c.device !== device) return;
  c.seeking = true; c.seekTarget = +position; c.position = +position; c.seekDeadline = Date.now() + 30000;
  renderCastNotice();
  const ok = await castControl(device, "seek", +position);
  if (casting !== c) return;
  c.seekDeadline = Date.now() + 5000;
  if (!ok) c.seeking = false;
  else toast(`已跳转电视到 ${dur(+position) || '0:00'}`);
  setTimeout(() => { if (casting === c) castStatus(device); }, 800);
}
function castVolume(device, volume) {
  const c = casting; if (!c || c.device !== device) return;
  const value = $("#castVolumeValue"); if (value) value.textContent = Math.round(volume) + "%";
  if (casting) casting.adjustingVolume = true;
  clearTimeout(castVolumeTimer);
  castVolumeTimer = setTimeout(async () => {
    if (casting !== c) return;
    await castControl(device, "volume", null, +volume);
    c.adjustingVolume = false;
  }, 150);
}
function finishCast() {
  const c = casting;
  if (c) saveCastWatch(c);
  clearInterval(castTimer); castTimer = null; clearTimeout(castVolumeTimer);
  const el = $("#watchBody video, #watchBody audio");
  if (el) {
    el.style.display = el.dataset.castDisplay || "";
    delete el.dataset.castDisplay;
    el.controls = true;
    if (c && watching && c.id === watching.id && c.part === watching.part && isFinite(c.position)) el.currentTime = c.position;
  }
  casting = null;
  const box = $("#castBox"); if (box) box.innerHTML = "";
  const overlay = $("#castOverlay"); if (overlay) { overlay.innerHTML = ""; overlay.hidden = true; }
  renderCastNotice();
  toast("已停止投屏，可在本机点播放");
}
async function castControl(device, action, position = null, volume = null) {
  const c = casting; if (!c || c.device !== device) return false;
  c.revision++;
  try {
    const r = await castRequest(c, "/api/cast/control", {device, action, position, volume});
    if (casting !== c || !r) return false;
    c.revision++;
    c.error = null;
    if (action === "stop") finishCast();
    else {
      if (action === "pause") c.state = 'PAUSED_PLAYBACK';
      if (action === "play") c.state = 'PLAYING';
      renderCastNotice();
    }
    return true;
  } catch (e) { castError(c, e); return false; }
}
function updateWatchStatus() {
  const el = $("#wstatus"); if (!el || !watching) return;
  const j = state.jobs.find(x => x.id === watching.id); if (!j) return;
  if (j.status === "done" && (j.media || []).length) { openWatch(j.id); return; }  // just finished: show the player
  el.innerHTML = j.status === "queued" ? "排队中…" : j.status === "failed" ? "下载失败" : j.status === "cancelled" ? "已取消"
    : j.missing ? "文件已经从硬盘上删除了（可能是在 Plex 或共享文件夹里删的）"
    : j.status === "done" ? "这个任务没有可以播放的文件"
    : `${esc(STAGES[j.stage] || j.stage || "处理中")} ${j.progress ? j.progress.toFixed(0) + "%" : ""}<br>${esc(j.speed || "")}`;
}
function closeWatch() {
  stopMedia();
  watching = null; document.body.style.overflow = "";
  hide($("#watch"), () => { $("#watchBody").innerHTML = ""; });
}

/* ---------- privacy mode (hidden menu: tap the avatar three times) ---------- */
// Triple tap, or press and hold for a second, opens the privacy menu; a single tap opens the account menu
let taps = 0, tapTimer, holdTimer, held = false;
function avatarTap() {
  if (held) { held = false; return; }  // this click ends a long press that already opened the menu
  taps++; clearTimeout(tapTimer);
  if (taps >= 3) { taps = 0; openPrivacy(); return; }
  tapTimer = setTimeout(() => { const n = taps; taps = 0; if (n) openAccount(); }, 500);
}
(() => {
  const av = document.getElementById("avatar");
  const start = () => { held = false; clearTimeout(holdTimer); holdTimer = setTimeout(() => { held = true; taps = 0; clearTimeout(tapTimer); openPrivacy(); }, 1000); };
  const stop = () => clearTimeout(holdTimer);
  av.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => av.addEventListener(ev, stop));
  av.addEventListener("contextmenu", e => e.preventDefault());
})();
function lockPrivacy(quiet) {
  if (!privacyToken) return;
  privacyToken = null; clearTimeout(privacyTimer);
  if (!$("#privacySheet").hidden) hide($("#privacySheet"));
  if (selecting) toggleSelect();
  if (!quiet) toast("已隐藏");
  // leave the player alone unless it's showing something that is now hidden again
  if (watching && (state.jobs.find(j => j.id === watching.id) || {}).hidden) closeWatch();
  refresh();
}
document.addEventListener("visibilitychange", () => {

});
async function privacyApi(body) {
  const r = await fetch("/api/privacy", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (r.status === 403) { lockPrivacy(true); toast("隐私菜单已锁上，请重新打开"); return false; }

async function openPrivacy() {

      privacyToken = j.token;

  }
  const r = await fetch("/api/privacy");

  const p = await r.json();
  const tagChips = p.tags.map((t, i) =>

    <label class="check" style="margin-bottom:16px"><input type="checkbox" id="revealBox" ${p.revealed ? "checked" : ""}> 显示
      <span style="color:var(--muted)">只在这个页面有效；刷新页面、离开超过 1 分钟或 30 分钟后会自动恢复隐藏</span></label>
    <div class="psec">按标签隐藏</div>
    <div class="ptags">${tagChips || '<span class="sub">还没有</span>'}</div>
    <form id="ptagForm" class="row" style="margin:10px 0 16px">
      <input type="text" id="ptagInput" list="ptagList" placeholder="输入或选择标签" autocomplete="off" style="margin:0">
      <datalist id="ptagList">${p.library_tags.filter(t => !p.tags.includes(t)).map(t => `<option value="${esc(t)}">`).join("")}</datalist>
      <button class="btn" style="flex:none">添加</button>
    </form>

  $("#privacySheet").hidden = false;

  $("#ptagForm").onsubmit = e => {

}

async function loadBooks() {

    const r = await fetch("/api/books" + (p.size ? "?" + p : ""));

  } catch (e) {}

    booksBody = body;
    booksState = {books: JSON.parse(body).books, q: query, offline: false, loaded: true};
  } else {
    // no Pi (away from home, or it's restarting): the books cached on this device
    const local = pendingAll();
    booksState = {books: [...cacheIndex.values()].map(m => {
      const b = {...m.book}, pend = local[m.id];
      if (pend && (!b.read || pend.at > (b.read.at || 0))) b.read = {...(b.read || {}), pct: pend.pct, pos: pend.pos, at: pend.at};
      return b;
    }).filter(b => !query || (b.title + b.author).toLowerCase().includes(query.toLowerCase())), q: query, offline: true, loaded: true};
    await offlineCovers();
  }

  if (bookTab !== "all" && !n[bookTab]) bookTab = "all";

/* ---------- books cached on this device (IndexedDB): meta (small, listed), data (the pack; a PDF's file), res (pictures, covers)
   Books you open are cached automatically (oldest dropped past the limit); 缓存到本机 keeps one for good. */
const cacheIndex = new Map(), coverUrls = new Map();
const idb = {
  p: null,
  open() {
    return this.p || (this.p = new Promise((ok, no) => {
      const r = indexedDB.open("shiguang-books", 1);
      r.onupgradeneeded = () => { for (const n of ["meta", "data", "res"]) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    }));
  },
  async run(store, mode, fn) {
    const d = await this.open();
    return new Promise((ok, no) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => ok(req ? req.result : undefined);
      t.onerror = t.onabort = () => no(t.error);
    });
  },
  get(st, k) { return this.run(st, "readonly", s => s.get(k)); },
  put(st, k, v) { return this.run(st, "readwrite", s => s.put(v, k)); },
  del(st, k) { return this.run(st, "readwrite", s => s.delete(k)); },
  all(st) { return this.run(st, "readonly", s => s.getAll()); },
};
const autoCache = () => lsGet("bookAutoCache", "1") === "1";
const cacheLimitMB = () => +lsGet("bookCacheLimit", "1024");
async function refreshCacheIndex() {
  let metas = [];
  try { metas = await idb.all("meta"); } catch (e) { return; }
  cacheIndex.clear();
  metas.forEach(m => cacheIndex.set(m.id, m));
}
async function offlineCovers() {
  for (const m of cacheIndex.values()) {
    if (coverUrls.has(m.id) || !m.book.cover) continue;
    const bl = await idb.get("res", `${m.id}|cover`).catch(() => null);
    if (bl) coverUrls.set(m.id, URL.createObjectURL(bl));
  }
}
const resUrl = (b, p) => `/bookres/${b.id}?p=${encodeURIComponent(p)}&v=${b.version}`;
let caching = {};
async function cacheBook(b, {pinned = false, pack = null} = {}) {
  if (caching[b.id]) return caching[b.id];
  return caching[b.id] = (async () => {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    if (!pack) {
      const r = await fetch(`/api/books/${b.id}/pack`);
      if (!r.ok) throw new Error("书还没准备好");
      pack = await r.json();
    }
    const old = cacheIndex.get(b.id), data = {pack};
    let size = new Blob([JSON.stringify(pack)]).size;
    if (pack.view === "pdf") {
      const r = await fetch(`/bookfile/${b.id}?v=${b.version}`);
      if (!r.ok) throw new Error("PDF 下载失败");
      data.file = await r.blob();
      size += data.file.size;
    }
    if (old && old.v !== b.version) await cacheDrop(b.id);
    await idb.put("data", b.id, data);
    const book = {...b}; delete book.hits;
    const meta = {id: b.id, v: b.version, size, pinned: pinned || !!(old && old.pinned && old.v === b.version), cached: Date.now(),
                  used: Date.now(), complete: false, book};
    await idb.put("meta", b.id, meta);
    cacheIndex.set(b.id, meta);
    // the pictures and the cover too, so the book reads the same without the Pi
    for (const p of [...(pack.res || []), ...(b.cover ? ["cover"] : [])]) {
      if (await idb.get("res", `${b.id}|${p}`).catch(() => null)) continue;
      try {
        const r = await fetch(p === "cover" ? `/bookcover/${b.id}?v=${b.version}` : resUrl(b, p));
        if (!r.ok) continue;
        const bl = await r.blob();
        await idb.put("res", `${b.id}|${p}`, bl);
        meta.size += bl.size;
      } catch (e) {}
    }
    meta.complete = true;
    await idb.put("meta", b.id, meta);
    await evictCache(b.id);
    return meta;
  })().finally(() => { delete caching[b.id]; if (chip === "books") renderBooks(); });
}
async function cacheDrop(id) {
  await idb.del("meta", id);
  await idb.del("data", id);
  await idb.run("res", "readwrite", s => s.delete(IDBKeyRange.bound(`${id}|`, `${id}|￿`)));
  cacheIndex.delete(id);
  if (coverUrls.has(id)) { URL.revokeObjectURL(coverUrls.get(id)); coverUrls.delete(id); }
}
async function evictCache(keep) {
  const limit = cacheLimitMB() * 1048576;
  if (!limit) return;
  let total = [...cacheIndex.values()].reduce((a, m) => a + m.size, 0);
  for (const m of [...cacheIndex.values()].sort((a, b) => a.used - b.used)) {
    if (total <= limit) break;
    if (m.pinned || m.id === keep) continue;
    await cacheDrop(m.id);
    total -= m.size;
  }
}
async function openCacheSheet() {

  try { const e = await navigator.storage.estimate(); est = `浏览器给这个网页的空间约 ${bytes(e.quota)}，已用 ${bytes(e.usage)}。`; } catch (e) {}

    <label class="check" style="margin-bottom:10px"><input type="checkbox" ${autoCache() ? "checked" : ""} onchange="lsSet('bookAutoCache', this.checked ? '1' : '0')"> 打开过的书自动缓存</label>
    <div class="rd-row" style="margin-bottom:10px"><span class="sub">自动缓存最多占</span>
      <div class="seg">${[[512, "512 MB"], [1024, "1 GB"], [4096, "4 GB"], [0, "不限"]].map(([v, t]) =>
        `<button class="${v === lim ? "on" : ""}" onclick="lsSet('bookCacheLimit', '${v}'); evictCache().then(openCacheSheet)">${t}</button>`).join("")}</div></div>
    <div class="devs">${metas.map(m => `<div class="dev"><div class="dev-main"><b>${esc(m.book.title)}</b><div class="sub">${bytes(m.size)} · ${m.pinned ? "手动缓存" : "自动缓存"} · ${esc(ago(m.used / 1000))}打开${m.complete ? "" : " · 没缓存完"}</div></div>
      <button class="btn plain" onclick="cacheDrop(${m.id}).then(openCacheSheet).then(renderBooks)">删除</button></div>`).join("") || '<p class="sub">还没有缓存的书。</p>'}</div>
    <div class="row" style="margin-top:14px">
      ${metas.length ? `<button class="btn plain" onclick="if (confirm('删除这台设备上缓存的所有书？书架上的书不受影响。')) Promise.all([...cacheIndex.keys()].map(cacheDrop)).then(openCacheSheet).then(renderBooks)">全部删除 ${bytes(total)}</button>` : ""}
      ${booksState.offline ? "" : `<button class="btn plain" onclick="cacheAll()">缓存全部书</button>`}
      <button class="btn" onclick="hide($('#bookSheet'))">好</button>
    </div>`;
  $("#bookSheet").hidden = false;

async function cacheAll() {
  hide($("#bookSheet"));
  const todo = booksState.books.filter(b => b.status === "ready" && !(cacheIndex.get(b.id) && cacheIndex.get(b.id).v === b.version && cacheIndex.get(b.id).complete));
  let done = 0;
  for (const b of todo) {
    toast(`正在缓存 ${done + 1}/${todo.length}：《${b.title}》`);

/* ---------- reading progress: saved to the Pi (every device carries on where you are), queued while offline ---------- */
function pendingAll() { try { return JSON.parse(localStorage.getItem("bookPending") || "{}"); } catch (e) { return {}; } }
function queueProgress(id, body) {
  const q = pendingAll(), old = q[id];
  q[id] = {...body, secs: ((old && old.secs) || 0) + (body.secs || 0), at: body.at || Date.now() / 1000};
  lsSet("bookPending", JSON.stringify(q));
}
function postProgress(id, body) {
  fetch(`/api/books/${id}/progress`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body), keepalive: true})
    .then(r => { if (r.status >= 500 || r.status === 0) throw new Error(); })
    .catch(() => queueProgress(id, body));
}
function flushPendingProgress() {
  const q = pendingAll();
  if (!Object.keys(q).length) return;
  try { localStorage.removeItem("bookPending"); } catch (e) {}
  for (const [id, body] of Object.entries(q)) postProgress(+id, body);
}
window.addEventListener("online", flushPendingProgress);

/* ---------- the reader ---------- */
let rd = {id: null};
const RD_DEFAULT = {size: innerWidth < 640 ? 18 : 20, lh: 1.8, font: "serif", mode: "paged", theme: "paper"};
let rdPrefs = (() => { try { return {...RD_DEFAULT, ...JSON.parse(localStorage.getItem("readerPrefs") || "{}")}; } catch (e) { return {...RD_DEFAULT}; } })();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function rdApplyPrefs() {
  const r = $("#reader");
  r.classList.toggle("night", rdPrefs.theme === "night");
  r.classList.toggle("f-sans", rdPrefs.font === "sans");
  r.classList.toggle("f-pixel", rdPrefs.font === "pixel");
  r.classList.toggle("scroll", rdPrefs.mode === "scroll" && !!rd.pack && rd.pack.view !== "pdf");
  r.style.setProperty("--rd-size", rdPrefs.size + "px");
  r.style.setProperty("--rd-lh", rdPrefs.lh);
}
async function openReader(id, at = null) {
  let b = bookById(id);
  if (!b || !b.version) {
    try { const r = await fetch(`/api/books/${id}`); if (r.ok) b = (await r.json()).book; } catch (e) {}
    b = b || (cacheIndex.get(id) || {}).book;
  }
  if (!b) { toast("这本书不见了"); return; }
  if (b.status && b.status !== "ready") { toast(b.status === "failed" ? "这本书导入失败了：" + b.error : "还在导入，等一下"); return; }
  if (rd.id) rdClose(true);
  rd = {id, b, secs: 0, lastAct: Date.now(), urls: [], marks: [], page: 0, ch: 0, zoom: 1, zoomKey: 1};
  hide($("#bookSheet")); hide($("#askSheet"));
  const el = $("#reader");
  el.classList.remove("ui");
  rdApplyPrefs();
  $("#rdTitle").textContent = b.title;
  $("#rdFlow").innerHTML = ""; $("#rdPdf").innerHTML = ""; $("#rdPop").hidden = true; $("#rdBack").hidden = true;
  $("#rdHead").textContent = $("#rdHeadR").textContent = $("#rdFoot").textContent = $("#rdFootR").textContent = "";
  rdClosePanels();
  $("#rdLoad").hidden = false; $("#rdLoad").textContent = `正在打开《${b.title}》…`;
  el.hidden = false;
  document.body.style.overflow = "hidden";
  if (!(history.state && history.state.reader)) history.pushState({reader: id}, "", "#book=" + id);
  else history.replaceState({reader: id}, "", "#book=" + id);
  let data;
  try { data = await bookData(b); }
  catch (e) { if (rd.id === id) $("#rdLoad").textContent = "打不开：连不上 Pi，这本书也没有缓存在这台设备上。"; return; }
  if (rd.id !== id) return;
  rd.pack = data.pack; rd.file = data.file || null; rd.cached = !!data.cached;
  fetch(`/api/books/${id}`).then(r => r.json()).then(j => { if (rd.id === id) { rd.marks = j.book.marks || []; rdUpdate(); } }).catch(() => {});
  // where to start: a search hit, else where you were (a save made offline on this device if it's newer)
  const pend = pendingAll()[id];
  const pos = (at && at.pos) || (pend && (!b.read || pend.at > (b.read.at || 0)) ? pend.pos : b.read && b.read.pos) || null;
  rdApplyPrefs();
  try {
    if (rd.pack.view === "pdf") await rdSetupPdf(pos, at);
    else await rdSetupFlow(pos, at);
  } catch (e) {
    console.error(e);
    if (rd.id === id) { $("#rdLoad").hidden = false; $("#rdLoad").textContent = "这本书打不开：" + (e.message || e); }

  }
  if (rd.id === id && pos && !at && (pos.ch || pos.page || pos.f)) toast(`接着上次读：${pctStr(rdPct())}`);
}
async function bookData(b) {
  const m = cacheIndex.get(b.id);
  if (m && (m.v === b.version || booksState.offline)) {
    const d = await idb.get("data", b.id).catch(() => null);
    if (d) { m.used = Date.now(); idb.put("meta", b.id, m).catch(() => {}); return {...d, cached: true}; }
  }
  const r = await fetch(`/api/books/${b.id}/pack`);
  if (!r.ok) throw new Error("pack " + r.status);
  const pack = await r.json();
  if (autoCache() || (m && m.pinned)) setTimeout(() => cacheBook(b, {pack, pinned: !!(m && m.pinned)}).catch(() => {}), 1500);
  return {pack, cached: false};
}
function closeReader() {
  if (history.state && history.state.reader) history.back();
  else rdClose();
}
window.addEventListener("popstate", () => { if (rd.id && !(history.state && history.state.reader)) rdClose(); });
function rdClose(instant) {
  if (!rd.id) return;
  rdSave();
  rdRevoke();
  if (rd.io) rd.io.disconnect();
  if (rd.pdfTask) rd.pdfTask.destroy().catch(() => {});
  clearTimeout(rd.saveT);
  rd = {id: null};
  if (location.hash.startsWith("#book=")) history.replaceState(null, "", location.pathname + location.search);
  document.body.style.overflow = "";
  const done = () => { $("#rdFlow").innerHTML = ""; $("#rdPdf").innerHTML = ""; };
  if (instant) { $("#reader").hidden = true; done(); } else hide($("#reader"), done);
  booksBody = ""; lastBody = "";
  if (chip === "books") loadBooks(); else refresh();
}
function rdRevoke() { (rd.urls || []).forEach(u => URL.revokeObjectURL(u)); if (rd.urls) rd.urls = []; }

/* reflowed books: one chapter at a time, as pages side by side (CSS columns) that slide, or scrolling */
async function rdSetupFlow(pos, at) {
  $("#rdPdf").hidden = true; $("#rdView").hidden = false;
  rdZoomButtons(false);
  const p = rd.pack;
  rd.cum = []; let t = 0;
  p.chapters.forEach(c => { rd.cum.push(t); t += c.n || 0; });
  rd.total = Math.max(1, t);
  $("#rdFlow").lang = /^zh/i.test(p.lang || "zh") ? "zh" : p.lang;
  const ch = at && at.hit ? at.hit.ch : Math.min(p.chapters.length - 1, Math.max(0, (pos && pos.ch) || 0));
  await rdRender(ch, at && at.hit ? {hit: at.hit} : {f: (pos && pos.f) || 0});
  $("#rdLoad").hidden = true;
}
async function rdRender(i, opts = {}) {
  const flow = $("#rdFlow"), token = rd.token = (rd.token || 0) + 1;
  rd.ch = i;
  rd.busy = true;  // page turns wait until the chapter is laid out (two quick taps mustn't skip a chapter)
  rdRevoke();
  flow.classList.remove("anim");
  flow.style.transform = "none";
  flow.innerHTML = rd.pack.chapters[i].h + '<span class="rd-end"></span>'
    + (rdPrefs.mode === "scroll" ? `<button class="btn plain rd-next" onclick="rdChapter(1)" ${i >= rd.pack.chapters.length - 1 ? "hidden" : ""}>下一章 ›</button>` : "");
  $("#rdPop").hidden = true;
  await rdImages(flow);
  if (token !== rd.token || !rd.id) return;
  rd.busy = false;
  rdLayout();
  const page = $("#rdPage");
  if (rdPrefs.mode === "scroll") {
    page.scrollTop = 0;
    const target = opts.anchor ? flow.querySelector("#" + CSS.escape(opts.anchor)) : opts.hit ? rdShowHit(opts.hit) : null;
    if (target) target.scrollIntoView({block: "center"});
    else if (opts.last) page.scrollTop = page.scrollHeight;
    else if (opts.f) page.scrollTop = opts.f * (page.scrollHeight - page.clientHeight);
    rdUpdate();
    return;
  }
  let n = 0;
  if (opts.last) n = rd.pages - 1;
  else if (opts.anchor) n = rdPageOf(flow.querySelector("#" + CSS.escape(opts.anchor)));
  else if (opts.hit) n = rdPageOf(rdShowHit(opts.hit));

}
async function rdImages(root) {
  const imgs = [...root.querySelectorAll("img[data-res]")];
  await Promise.all(imgs.map(async img => {
    const p = img.dataset.res;
    let src = null;
    if (cacheIndex.has(rd.id)) {
      const bl = await idb.get("res", `${rd.id}|${p}`).catch(() => null);
      if (bl) { src = URL.createObjectURL(bl); rd.urls.push(src); }
    }
    img.src = src || resUrl(rd.b, p);
    if (img.complete) return;
    const loaded = new Promise(r => { img.onload = img.onerror = r; });
    // a slow picture: lay out without it, then again once it's there
    if (await Promise.race([loaded.then(() => true), new Promise(r => setTimeout(() => r(false), 2500))]) === false)
      loaded.then(() => { if (rd.id && img.isConnected) rdRelayout(); });
  }));
}
function rdGap() { return (parseFloat(getComputedStyle($("#reader")).getPropertyValue("--rd-mx")) || 20) * 2; }
function rdLayout() {
