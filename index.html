    ${proc.length ? `<div class="uscroll"><table class="ut"><tr><th>做了什么</th><th>次数</th><th>处理了多少</th><th>用时</th></tr>
      ${proc.map(w => `<tr><td>${esc(w.name)}</td><td>${num(w.count)}</td><td>${
        w.kind === "whisper" || w.kind === "encode" ? hours(w.amount) + "音视频" : num(w.amount) + " 张"}</td><td>${hours(w.seconds)}</td></tr>`).join("")}
    </table></div>` : '<p class="hint">这段时间还没有。</p>'}
    <div class="usec"><b>AI tokens 和花费</b><span class="sub">先用 Mac 上的 Claude（订阅），不行再用 Codex（订阅），都不在时用 DeepSeek（按量计费）</span></div>
    ${llm.length ? `<div class="uscroll"><table class="ut"><tr><th>用途</th><th>调用</th><th>输入<br>（缓存命中）</th><th>输出</th><th>花费</th></tr>
      ${llm.map(w => `<tr><td>${esc(w.name)}</td><td>${num(w.purpose === "earlier" ? w.amount : w.count)}</td>
        <td>${num(w.tokens_in)}${w.cache_hit ? `<br>（${num(w.cache_hit)}）` : ""}</td><td>${w.purpose === "earlier" ? "–" : num(w.tokens_out)}</td>
        <td>${w.kind === "claude" || w.kind === "codex" ? "订阅" : w.cost == null ? "–" : yuan(w.cost) + (w.guessed ? "*" : "")}</td></tr>`).join("")}
      <tr><td>合计</td><td>${num(llm.reduce((a, w) => a + (w.purpose === "earlier" ? w.amount : w.count), 0))}</td><td>${num(tokIn)}</td><td>${num(tokOut)}</td><td>${yuan(cost)}</td></tr>
    </table></div>
    <p class="hint">花费按 DeepSeek 标价算（工作日 9–12、14–18 点全价，其他时间半价）。${llm.some(w => w.guessed) ? "带 * 的含开始记花费前的调用，按没有缓存估算，偏高。" : ""}${
      u.balance ? ` 账户余额 ${yuan(u.balance.total, 2)}，这段时间余额实际减少 ${yuan(u.balance.charged)}（从 ${esc(new Date(u.balance.since * 1000).toLocaleDateString("zh-CN"))} 开始记，包括这个 key 的所有用途）。` : ""}</p>` : '<p class="hint">这段时间没有调用。</p>'}
    <div class="usec"><b>后台任务</b><span class="sub">任务板：谁能做谁领，Mac 在就交给 Mac。排队、进行中是现在的，完成、失败按所选时间</span></div>
    ${board.workers.length ? `<div class="workers">${board.workers.map(w => {
      const standby = !w.online && workerOnDemand(w.name) && board.workers.some(m => m.online && /^mac/i.test(m.name) && !workerOnDemand(m.name));
      return `<span class="wk ${w.online ? "on" : ""}">${esc(workerName(w.name))} ${
        w.online ? (w.paused ? "暂停（" + esc(w.paused) + "）" : "在线") : standby ? "待命" : "离线 · " + esc(ago(w.seen))}</span>`; }).join("")}</div>` : ""}
    ${board.running.length ? board.running.map(t => `<p style="margin:6px 0">${esc(workerName(t.worker))}正在${esc(t.label)}：${esc(t.title || "")}${t.pct != null ? `（${t.pct}%）` : ""}</p>`).join("")
      : `<p style="margin:6px 0">${board.busy ? "有下载在处理，Pi 先让它" : "现在没有任务在跑"}</p>`}
    ${kinds.length ? `<div class="uscroll"><table class="ut"><tr><th>任务</th><th>排队</th><th>进行中</th><th>完成</th><th>失败</th><th>待处理的视频总长</th></tr>
      ${kinds.map(k => `<tr><td>${esc(k.label)}</td><td>${num(k.queued)}</td><td>${num(k.running)}</td><td>${num(k.done)}</td><td>${num(k.failed)}</td><td>${k.hours ? k.hours + " 小时" : ""}</td></tr>`).join("")}</table></div>` : ""}
    ${board.failed.length ? `<p class="hint">最近失败：${board.failed.map(f => `${esc(f.label)}「${esc((f.title || "").slice(0, 20))}」${esc(f.error.slice(0, 60))}`).join("；")}</p>` : ""}
    ${(board.heal || []).length ? `<div class="usec"><b>自修复</b><span class="sub">报错交给 Mac 上的 Claude 诊断；改了代码、测试通过就自动上线</span></div>
      ${board.heal.map(h => `<p style="margin:6px 0"><b>${esc(HEAL_STATES[h.state] || h.state)}</b> ${esc(h.label)}${h.title ? "「" + esc(h.title.slice(0, 20)) + "」" : ""}${h.count > 1 ? `（${num(h.count)} 次）` : ""} · ${esc(ago(h.last))}<br>
        <span class="hint">${esc(h.diagnosis || h.why || h.error.slice(0, 120))}${h.commit ? " · 提交 " + esc(h.commit) : ""}</span></p>`).join("")}` : ""}
    <button class="btn plain wide" onclick="hide($('#usageSheet'))">关闭</button>`;
}

/* ---------- account ---------- */
async function openAccount() {
  if (!state.user) { renderAuth("login"); $("#accountSheet").hidden = false; return; }
  let acc = {devices: [], counts: {}};
  try { acc = await (await fetch("/api/account")).json(); } catch { /* still show the logout button */ }
  const rows = acc.devices.map(d => {
    const names = [d.label, ...d.phones];
    const n = names.reduce((sum, x) => sum + (acc.counts[x] || 0) + (acc.counts["📱 " + x] || 0), 0);
    return `<div class="dev">
      <div class="dev-main" onclick="filterDevice(${esc(JSON.stringify(names[d.phones.length ? 1 : 0]))})">
        <b>${esc(d.label)}</b>${d.current ? ' <span class="cur">当前设备</span>' : ""}
        <div class="sub">${n} 个内容 · 最近使用 ${esc(ago(d.seen))}</div>
      </div>
      ${d.current ? "" : `<button class="btn plain" onclick="removeDevice('${d.ids.join(",")}', false)">移除</button>`}
    </div>`;
  }).join("");
  $("#accountBody").innerHTML = `
    <h2>${esc(state.user)}${state.admin ? "（管理员）" : ""}</h2>
    <p style="color:var(--muted);margin:0 0 12px;font-size:13px">已登录这个账号的设备（${acc.devices.length} 台）。在其他手机、电脑上登录同一账号即可加入；点设备只看它添加的内容。</p>
    <div class="devs">${rows || '<div class="sub">还没有设备</div>'}</div>
    <button class="btn plain wide" style="margin-top:14px" onclick="logout()">退出登录</button>
    ${state.external ? `<p class="hint">改密码要在家里的网络。</p>` : `<button class="btn plain wide" style="margin-top:8px" id="pwBtn" onclick="openPwForm()">修改密码</button>
    <form id="pwForm" hidden novalidate style="margin-top:8px">
      <label class="field"><input type="password" id="pwOld" placeholder="原密码" autocomplete="current-password"></label>
      <label class="field"><input type="password" id="pwNew" placeholder="新密码（至少 8 位）" autocomplete="new-password"></label>
      <label class="field"><input type="password" id="pwNew2" placeholder="再输一次新密码" autocomplete="new-password"></label>
      <div class="form-err" id="pwErr" hidden></div>
      <button class="btn wide">保存新密码</button>
    </form>`}
    ${acc.shortcut_key ? `<div class="psec" style="margin-top:18px">快捷指令密钥</div>
    <p class="hint" style="margin-top:0">「发送到拾光（外网）」快捷指令和安卓外网版用它认出你的账号（iPhone 版已经带上，不用手填）。别发给别人；手机丢了就换一个，旧密钥立刻失效，外网版快捷指令要重新安装。</p>
    <code class="copy block" id="shortcutKey" onclick="copyText(this)">${esc(acc.shortcut_key)}</code>
    <button class="btn plain" style="margin-top:8px" onclick="newShortcutKey()">换一个</button>` : ""}
    ${shareTips()}`;
  $("#accountSheet").hidden = false;
}
function openPwForm() {
  const f = $("#pwForm"), err = t => { $("#pwErr").textContent = t || ""; $("#pwErr").hidden = !t; };
  f.hidden = false; $("#pwBtn").hidden = true; $("#pwOld").focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const old = $("#pwOld").value, pw = $("#pwNew").value;
    if (pw.length < 8) { err("新密码至少 8 位"); $("#pwNew").focus(); return; }
    if (pw !== $("#pwNew2").value) { err("两次输入的新密码不一样"); $("#pwNew2").focus(); return; }
    const r = await fetch("/api/password", {method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({old, new: pw})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { err(j.error || "没改成"); return; }
    f.hidden = true; $("#pwBtn").hidden = false; f.reset(); err(""); toast("密码已修改");
  };
}
async function newShortcutKey() {
  if (!confirm("换成新密钥？用旧密钥的快捷指令都要重新安装。")) return;
  const r = await (await fetch("/api/shortcut-key/new", {method: "POST"})).json();
  if (r.shortcut_key) { $("#shortcutKey").textContent = r.shortcut_key; toast("已换新密钥，记得重新安装外网版快捷指令"); }
}
/* login / register: one mode at a time with a single button, inline checks and errors */
function renderAuth(mode, keep = {}) {
  const reg = mode === "register";
  $("#accountBody").innerHTML = `
    <h2>${reg ? "注册账号" : "登录"}</h2>
    <p class="hint">${reg ? "注册后，这台设备会自动加入账号。以后在其他手机、电脑上登录同一个账号，所有设备的内容会合在一起。"
                         : "登录后，这台设备之前添加的内容会合并到账号里。"}</p>
    <form id="authForm" novalidate>
      <label class="field">
        <input type="text" id="username" placeholder="用户名" autocomplete="username" autocapitalize="off" spellcheck="false"
               maxlength="32" value="${esc(keep.name || "")}">
        <span class="note" id="nameNote">${reg ? "字母、数字、汉字或 . - _，最多 32 个" : ""}</span>
      </label>
      <label class="field pw">
        <input type="password" id="password" placeholder="${reg ? "设置密码（至少 8 位）" : "密码"}"
               autocomplete="${reg ? "new-password" : "current-password"}" value="${esc(keep.password || "")}">
        <button type="button" class="eye" onclick="togglePw()" aria-label="显示密码">显示</button>
      </label>
      ${reg ? `<label class="field"><input type="password" id="password2" placeholder="再输一次密码" autocomplete="new-password">
               <span class="note" id="pw2Note"></span></label>` : ""}
      <div class="form-err" id="authErr" hidden></div>
      <button class="btn wide" id="authBtn">${reg ? "注册并登录" : "登录"}</button>
    </form>
    ${state.external ? `<p class="hint" style="margin-top:12px">你在外网访问拾光，需要先登录。新账号只能在家里的网络注册。</p>`
    : `<div class="switch">${reg ? `已经有账号？<a href="#" onclick="renderAuth('login', authValues()); return false">去登录</a>`
                              : `还没有账号？<a href="#" onclick="renderAuth('register', authValues()); return false">注册一个</a>`}</div>`}
    ${shareTips()}`;
  const f = $("#authForm"), name = $("#username"), pw = $("#password"), pw2 = $("#password2");
  setTimeout(() => (name.value ? pw : name).focus(), 50);
  const err = t => { $("#authErr").textContent = t || ""; $("#authErr").hidden = !t; };
  [name, pw, pw2].forEach(el => el && el.addEventListener("input", () => err("")));
  if (reg) {
    let timer;
    name.addEventListener("input", () => {
      clearTimeout(timer);
      const v = name.value.trim(), note = $("#nameNote");
      note.className = "note";
      if (!v) { note.textContent = "字母、数字、汉字或 . - _，最多 32 个"; return; }
      if (!/^[\w.\-\u4e00-\u9fff]{1,32}$/.test(v)) { note.textContent = "只能用字母、数字、汉字或 . - _"; note.className = "note bad"; return; }
      timer = setTimeout(async () => {
        const r = await (await fetch("/api/name-available?name=" + encodeURIComponent(v))).json();
        if (name.value.trim() !== v) return;
        note.textContent = r.available ? "✓ 可以用" : "这个用户名已被注册";
        note.className = "note " + (r.available ? "good" : "bad");
      }, 300);
    });
    pw2.addEventListener("input", () => {
      const note = $("#pw2Note");
      note.textContent = pw2.value && pw2.value !== pw.value ? "两次输入的密码不一样" : "";
      note.className = "note bad";
    });
    if (name.value) name.dispatchEvent(new Event("input"));
  }
  f.onsubmit = async e => {
    e.preventDefault();
    const n = name.value.trim(), p = pw.value;
    if (!n) { err("请输入用户名"); name.focus(); return; }
    if (!p) { err("请输入密码"); pw.focus(); return; }
    if (reg && p.length < 8) { err("密码至少 8 位"); pw.focus(); return; }
    if (reg && p !== pw2.value) { err("两次输入的密码不一样"); pw2.focus(); return; }
    const btn = $("#authBtn"); btn.disabled = true; btn.textContent = reg ? "注册中…" : "登录中…";
    try {
      const r = await fetch("/api/" + mode, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: n, password: p})});
      const j = await r.json();
      if (r.ok) {
        hide($("#accountSheet"));
        toast(reg ? `欢迎，${n}！这台设备已加入账号` : `欢迎回来，${n}`);
        await refresh();
        return;
      }
      err(j.error);
      if (!reg && r.status === 403) { pw.select(); pw.focus(); }
    } catch { err("连不上 Pi，稍后再试"); }
    btn.disabled = false; btn.textContent = reg ? "注册并登录" : "登录";
  };
}
function authValues() { return {name: $("#username")?.value || "", password: $("#password")?.value || ""}; }
function togglePw() {
  const show = $("#password").type === "password";
  document.querySelectorAll("#authForm input[type=password], #authForm input.shown").forEach(el => {
    el.type = show ? "text" : "password"; el.classList.toggle("shown", show);
  });
  $(".eye").textContent = show ? "隐藏" : "显示";
}

function filterDevice(name) { deviceFilter = name; chip = "device"; hide($("#accountSheet")); render(); }
async function removeDevice(id, current) {
  await fetch(`/api/devices/${id}/remove`, {method: "POST"});
  toast(current ? "已退出" : "已移除这台设备（它添加的内容还在账号里）");
  await refresh();
  if (state.user) openAccount(); else hide($("#accountSheet"));
}
async function logout() { await fetch("/api/logout", {method: "POST"}); hide($("#accountSheet")); toast("已退出"); refresh(); }

/* ---------- search ---------- */
function searchFor(t) { closeWatch(); $("#search").value = t; query = t; refresh(); window.scrollTo(0, 0); }
let searchTimer;
// A sentence ("上个月小王讲伊朗、画面里有地图的片段") is read by the AI once typing pauses; words search right away
let smartSearch = false, exactSearch = false;
function looksLikeSentence(t) { return !/^[#＃]/.test(t) && t.length >= 6 && /[\u4e00-\u9fff]/.test(t) && chip !== "notes" && chip !== "books"; }
$("#search").oninput = () => {
  clearTimeout(searchTimer);
  const t = $("#search").value.trim();
  exactSearch = false;
  searchTimer = setTimeout(() => { query = t; smartSearch = looksLikeSentence(t); refresh(); }, looksLikeSentence(t) ? 900 : 250);
};
function searchExact() { exactSearch = true; lastBody = ""; refresh(); }

refresh().then(() => {
  // a link to a book (#book=12) opens it; so does reloading the page while reading
  const m = /^#book=(\d+)$/.exec(location.hash);
  if (m) openReader(+m[1]);
});
refreshCacheIndex();
// over https (from outside) the page itself is kept too, so cached books open without the Pi
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
